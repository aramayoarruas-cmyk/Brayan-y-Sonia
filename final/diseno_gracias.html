<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:Lilita;src:url(LilitaOne-Regular.ttf)}
@font-face{font-family:Mont;src:url("Montserrat[wght].ttf");font-weight:100 900}
:root{--navy:#232F5F;--title:#2E3A84;--peri:#6F7BCF;--coral:#EF5F56;--gold:#F2B544}
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:Mont,sans-serif;color:var(--navy)}
#c{width:680px;display:flex;flex-direction:column;gap:16px;padding:26px 8px 8px}
.hero{position:relative;background:linear-gradient(150deg,#232F5F 0%,#2E3A84 55%,#4A56B8 100%);border-radius:28px;height:640px;color:#fff;overflow:visible}
.hero .k{position:absolute;left:34px;top:34px;font-size:12px;font-weight:800;letter-spacing:4px;color:var(--gold)}
.slogan{position:absolute;left:34px;top:70px;z-index:2;font-family:Lilita;font-weight:400;line-height:.92}
.slogan .l1{font-size:92px;display:block}
.slogan .l2{font-size:92px;display:block;color:transparent;-webkit-text-stroke:2.5px #fff}
.slogan .l3{font-size:58px;display:block;margin-top:22px;color:var(--gold)}
.slogan .l4{font-size:58px;display:block;color:#C9CEF4}
.disc{position:absolute;right:10px;bottom:20px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#DCE3FA 0%,#B9C2EE 55%,rgba(185,194,238,0) 72%)}
.hero img{position:absolute;right:6px;bottom:-26px;height:330px;filter:drop-shadow(0 24px 28px rgba(0,0,0,.5))}
.wave{position:absolute;left:34px;bottom:40px;display:flex;gap:5px;align-items:flex-end;height:46px}
.wave i{display:block;width:7px;border-radius:4px;background:linear-gradient(180deg,#F2B544,#EF5F56)}
.foot{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:stretch}
.thanks{background:#fff;border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;justify-content:center}
.thanks b{font-family:Lilita;font-weight:400;font-size:32px;line-height:1}
.thanks span{font-size:13px;font-weight:700;color:var(--peri);margin-top:8px;letter-spacing:.5px}
.qr{background:#fff;border-radius:22px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.qr img{width:96px;height:96px;border-radius:8px}
.qr small{font-size:11.5px;font-weight:800;line-height:1.35;width:110px}
</style></head><body><div id="c">
 <div class="hero">
  <div class="k">JORDÁNMUSIK · SISTEMA DE INFORMACIÓN DE MARKETING</div>
  <div class="slogan">
   <span class="l1">Datos que</span>
   <span class="l2">suenan.</span>
   <span class="l3">Decisiones que</span>
   <span class="l4">se escuchan.</span>
  </div>
  <div class="wave" id="wave"></div>
  <div class="disc"></div><img src="jordanpods_hd.png" alt="">
 </div>
 <div class="foot">
  <div class="thanks"><b>¡Gracias por escucharnos!</b><span>Brayan Aramayo y Sonia Lázaro · Tu equipo de marketing</span></div>
  <div class="qr"><img src="qr_web.png" alt=""><small>Escanea y descubre el proyecto en la web</small></div>
 </div>
</div>
<script>
let h='';[12,22,34,18,28,42,16,26,38,22,12,30,18,10,24].forEach(x=>h+=`<i style="height:${x}px"></i>`);document.getElementById('wave').innerHTML=h;
</script></body></html>
